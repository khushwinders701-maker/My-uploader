<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Apps - KH90 Store</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; padding: 20px; }
        .container { max-width: 600px; margin: auto; }
        .box { background: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0px 4px 10px rgba(0,0,0,0.5); }
        h2, h3 { text-align: center; color: #007bff; }
        input, textarea, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; box-sizing: border-box; }
        input, textarea { background: #333; color: white; }
        button { background: #007bff; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        .hidden { display: none; }
        #message { color: #ffc107; text-align: center; font-weight: bold; }
        
        /* ਐਪ ਲਿਸਟ ਸਟਾਈਲ */
        .app-item { background: #292929; padding: 15px; margin: 10px 0; border-radius: 6px; display: flex; flex-direction: column; }
        .app-actions { display: flex; gap: 10px; margin-top: 10px; }
        .btn-edit { background: #ffc107; color: black; width: auto; padding: 5px 15px; }
        .btn-delete { background: #dc3545; color: white; width: auto; padding: 5px 15px; }
        .btn-logout { background: #6c757d; color: white; width: auto; padding: 5px 10px; font-size: 12px; float: right; margin-top: -35px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <div class="box">
        <h2>Upload / Edit App</h2>
        <p id="message">Checking authentication...</p>
        <button id="logoutBtn" class="btn-logout hidden">Logout</button>

        <form id="uploadForm" class="hidden">
            <input type="hidden" id="editDocId"> 
            
            <input type="text" id="appName" placeholder="App Name" required>
            <textarea id="appDesc" placeholder="App Description" rows="3" required></textarea>
            <input type="url" id="appIcon" placeholder="App Icon Image Link (Google Drive / Imgur)">
            <input type="url" id="appLink" placeholder="App Download Link" required>
            <button type="submit" id="submitBtn">Publish App</button>
        </form>
    </div>

    <div id="userAppsSection" class="box hidden">
        <h3>Your Uploaded Apps</h3>
        <div id="appsList">Loading your apps...</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, query, where, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // ਤੁਹਾਡੀ ਅਸਲੀ ਕਨਫਿਗਰੇਸ਼ਨ
    const firebaseConfig = {
        apiKey: "AIzaSyAyFSQJSx7SsFYTbfRAEuNxWfeO2jTmv6Q",
        authDomain: "my-store1-1093c.firebaseapp.com",
        projectId: "my-store1-1093c",
        storageBucket: "my-store1-1093c.firebasestorage.app",
        messagingSenderId: "1095213665187",
        appId: "1:1095213665187:web:653cd17020c533583ca816",
        measurementId: "G-01QMD8PT02"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const uploadForm = document.getElementById('uploadForm');
    const message = document.getElementById('message');
    const logoutBtn = document.getElementById('logoutBtn');
    const userAppsSection = document.getElementById('userAppsSection');
    const appsList = document.getElementById('appsList');
    const submitBtn = document.getElementById('submitBtn');
    
    let currentUser = null;
    let unsubscribe = null;

    // 1. ਚੈੱਕ ਕਰੋ ਯੂਜ਼ਰ ਲੌਗ-ਇਨ ਹੈ ਜਾਂ ਨਹੀਂ
    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            message.textContent = `Logged in as: ${user.email}`;
            uploadForm.classList.remove('hidden');
            userAppsSection.classList.remove('hidden');
            logoutBtn.classList.remove('hidden');
            loadUserApps(user.uid);
        } else {
            message.innerHTML = 'Please <a href="login.html" style="color:#007bff; text-decoration:none;">Login</a> first to upload apps.';
            uploadForm.classList.add('hidden');
            userAppsSection.classList.add('hidden');
            logoutBtn.classList.add('hidden');
            if (unsubscribe) unsubscribe();
        }
    });

    // 2. ਯੂਜ਼ਰ ਦੀਆਂ ਆਪਣੀਆਂ ਐਪਸ ਲੋਡ ਕਰਨਾ (ਮੇਨ ਪੇਜ ਦੇ ਮੁਤਾਬਕ 'name' ਅਤੇ 'downloadUrl')
    function loadUserApps(uid) {
        const q = query(collection(db, "apps"), where("uploadedBy", "==", uid));
        
        unsubscribe = onSnapshot(q, (querySnapshot) => {
            appsList.innerHTML = "";
            if (querySnapshot.empty) {
                appsList.innerHTML = "<p style='text-align:center; color:#aaa;'>No apps uploaded by you yet.</p>";
                return;
            }
            
            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const docId = docSnap.id;
                
                const appDiv = document.createElement('div');
                appDiv.className = 'app-item';
                appDiv.innerHTML = `
                    <strong style="font-size:18px; color:#fff;">${data.name || "Unnamed App"}</strong>
                    <p style="margin:5px 0; color:#ccc; font-size:14px;">${data.description || ""}</p>
                    <div class="app-actions">
                        <button class="btn-edit" onclick="editApp('${docId}', '${data.name || ""}', \`${data.description || ""}\`, '${data.downloadUrl || ""}', '${data.iconUrl || ""}')">Edit</button>
                        <button class="btn-delete" onclick="deleteApp('${docId}')">Delete</button>
                    </div>
                `;
                appsList.appendChild(appDiv);
            });
        });
    }

    // 3. ਐਪ ਪਬਲਿਸ਼ ਜਾਂ ਅਪਡੇਟ (ਸਟੋਰ ਪੇਜ ਦੇ ਮੁਤਾਬਕ 'name' ਅਤੇ 'downloadUrl' ਫੀਲਡਸ ਵਿੱਚ ਸੇਵ ਕਰੇਗਾ)
    uploadForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!currentUser) return alert("Please log in first!");

        const inputName = document.getElementById('appName').value;
        const desc = document.getElementById('appDesc').value;
        const icon = document.getElementById('appIcon').value;
        const link = document.getElementById('appLink').value;
        const editDocId = document.getElementById('editDocId').value;

        try {
            if (editDocId) {
                const appRef = doc(db, "apps", editDocId);
                await updateDoc(appRef, {
                    name: inputName,
                    description: desc,
                    iconUrl: icon, // ਆਈਕੋਨ ਲਿੰਕ ਅਪਡੇਟ
                    downloadUrl: link,
                    updatedAt: serverTimestamp()
                });
                alert("App updated successfully!");
                submitBtn.textContent = "Publish App";
                document.getElementById('editDocId').value = "";
            } else {
                await addDoc(collection(db, "apps"), {
                    name: inputName,
                    description: desc,
                    iconUrl: icon, // ਆਈਕੋਨ ਲਿੰਕ ਸੇਵ
                    downloadUrl: link,
                    uploadedBy: currentUser.uid,
                    uploaderEmail: currentUser.email,
                    createdAt: serverTimestamp()
                });
                alert("App uploaded successfully!");
            }
            uploadForm.reset();
        } catch (error) {
            alert("Error: " + error.message);
        }
    });

    // 4. ਲੌਗਆਉਟ ਫੰਕਸ਼ਨ
    logoutBtn.addEventListener('click', async () => {
        if (confirm("Are you sure you want to logout?")) {
            await signOut(auth);
            window.location.href = "login.html";
        }
    });

    // 5. ਐਡਿਟ ਫੰਕਸ਼ਨ
    window.editApp = function(id, name, desc, link, icon) {
        document.getElementById('editDocId').value = id;
        document.getElementById('appName').value = name;
        document.getElementById('appDesc').value = desc;
        document.getElementById('appIcon').value = icon || "";
        document.getElementById('appLink').value = link;
        submitBtn.textContent = "Update App Changes";
        window.scrollTo(0, 0);
    };

    // 6. ਡਿਲੀਟ ਫੰਕਸ਼ਨ
    window.deleteApp = async function(id) {
        if (confirm("Are you sure you want to delete this app?")) {
            try {
                await deleteDoc(doc(db, "apps", id));
                alert("App deleted successfully!");
            } catch (error) {
                alert("Error deleting app: " + error.message);
            }
        }
    };
</script>

</body>
</html>
